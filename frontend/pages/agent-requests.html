<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../js/auth-guard.js"></script>
    <title>Demandes reçues - TransaLink</title>
    <script>
      (function () {
        const theme = localStorage.getItem("transalink_theme");
        const fontScale =
          localStorage.getItem("transalink_font_scale") || "100";

        document.documentElement.style.fontSize = fontScale + "%";

        if (theme === "dark") {
          document.documentElement.classList.add("dark-mode-preload");
        }
      })();
    </script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body class="app-body">
    <main class="mobile-app transaction-app">
      <header class="app-header">
        <button class="icon-btn" onclick="goBack()">←</button>
        <div>
          <h1>Demandes reçues</h1>
          <p>Valider, refuser ou marquer envoyé</p>
        </div>
        <button class="icon-btn" onclick="loadTransactions()">⟳</button>
      </header>

      <section class="requests-page">
        <div class="filter-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Rechercher numéro ou montant..."
            oninput="applyFilters()"
          />

          <select id="statusFilter" onchange="applyFilters()">
            <option value="all">Tous statuts</option>
            <option value="pending">En attente</option>
            <option value="approved">Validées</option>
            <option value="sent">Envoyées</option>
            <option value="rejected">Refusées</option>
            <option value="cancelled">Annulées</option>
          </select>

          <select id="periodFilter" onchange="applyFilters()">
            <option value="today">Aujourd’hui</option>
            <option value="week">Cette semaine</option>
            <option value="month">Ce mois</option>
            <option value="all">Tout</option>
          </select>
          <button
            type="button"
            class="calendar-filter-btn"
            onclick="openDateModal()"
          >
            📅
            <span id="selectedDateLabel">Date</span>
          </button>
        </div>

        <div class="mini-summary" id="miniSummary"></div>

        <div id="requestsList" class="requests-list">
          <p class="empty-text">Chargement des demandes...</p>
        </div>

        <div class="pagination-box" id="paginationBox"></div>
      </section>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/app-settings.js"></script>
    <script src="../js/app-nav.js"></script>
    <script>
      const token = localStorage.getItem("transalink_token");
      const user = JSON.parse(localStorage.getItem("transalink_user"));

      if (!token || !user || user.role !== "agent") {
        window.location.href = "../index.html";
      }

      const headers = {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      };

      const requestsList = document.getElementById("requestsList");
      const paginationBox = document.getElementById("paginationBox");
      const miniSummary = document.getElementById("miniSummary");

      let allTransactions = [];
      let filteredTransactions = [];
      let currentPage = 1;
      const itemsPerPage = 10;

      let mediaRecorder = null;
      let audioChunks = [];
      let agentAudioBlob = null;
      let audioStream = null;
      let selectedReceiptFile = null;
      let receiptImageDataUrl = "";
      let receiptRotation = 0;
      let cropCanvas = null;
      let cropCtx = null;
      let cropImage = null;

      let brushCanvas = null;
      let brushCtx = null;

      let cropSelection = null;

      let cropEditorMode = "crop";

      let cropPointerStart = null;
      let cropSelectionStart = null;
      let activeCropHandle = null;

      let isBrushing = false;
      let lastBrushPoint = null;

      let receiptEditorDataUrl = "";

      function formatMoney(amount) {
        return Number(amount || 0).toLocaleString("fr-FR") + " FC";
      }

      function showPopup(type, title, message) {
        const oldPopup = document.getElementById("appPopup");
        if (oldPopup) oldPopup.remove();

        const isSuccess = type === "success";

        document.body.insertAdjacentHTML(
          "beforeend",
          `
    <div class="custom-modal" id="appPopup" style="z-index:99999;">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h2>${isSuccess ? "✅" : "❌"} ${title}</h2>
        <p>${message}</p>

        <div class="modal-actions">
          <button type="button" class="small-btn ${isSuccess ? "success-btn" : "danger-btn"}" onclick="closePopup(event)">
            OK
          </button>
        </div>
      </div>
    </div>
  `,
        );
      }

      function closePopup(event) {
        if (event) event.stopPropagation();
        const popup = document.getElementById("appPopup");
        if (popup) popup.remove();
      }
      function formatDate(date) {
        return new Date(date).toLocaleString("fr-FR", {
          weekday: "short",
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function statusLabel(status) {
        const labels = {
          pending: "En attente",
          approved: "Validée",
          sent: "Envoyée",
          rejected: "Refusée",
          cancelled: "Annulée",
        };
        return labels[status] || status;
      }

      function isSameDay(date1, date2) {
        return (
          date1.getFullYear() === date2.getFullYear() &&
          date1.getMonth() === date2.getMonth() &&
          date1.getDate() === date2.getDate()
        );
      }

      function isSameWeek(date) {
        const today = new Date();
        const currentDay = today.getDay() || 7;

        const monday = new Date(today);
        monday.setDate(today.getDate() - currentDay + 1);
        monday.setHours(0, 0, 0, 0);

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        sunday.setHours(23, 59, 59, 999);

        return date >= monday && date <= sunday;
      }

      function isSameMonth(date) {
        const today = new Date();
        return (
          date.getFullYear() === today.getFullYear() &&
          date.getMonth() === today.getMonth()
        );
      }
      let selectedDateFilter = "";

      function openDateModal() {
        const oldModal = document.getElementById("dateModal");
        if (oldModal) oldModal.remove();

        document.body.insertAdjacentHTML(
          "beforeend",
          `
    <div class="custom-modal" id="dateModal" onclick="closeDateModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h2>📅 Filtrer par date</h2>
        <p>Choisis une date précise pour afficher seulement les demandes de ce jour.</p>

        <label>Date voulue</label>
        <input type="date" id="singleDateInput" value="${selectedDateFilter}" />

        <div class="modal-actions">
          <button class="small-btn danger-btn" onclick="clearDateFilter()">Effacer</button>
          <button class="small-btn success-btn" onclick="applySingleDateFilter()">Appliquer</button>
        </div>
      </div>
    </div>
  `,
        );
      }

      function closeDateModal() {
        const modal = document.getElementById("dateModal");
        if (modal) modal.remove();
      }

      function applySingleDateFilter() {
        selectedDateFilter = document.getElementById("singleDateInput").value;

        document.getElementById("selectedDateLabel").textContent =
          selectedDateFilter
            ? new Date(selectedDateFilter).toLocaleDateString("fr-FR")
            : "Date";

        closeDateModal();
        applyFilters();
      }

      function clearDateFilter() {
        selectedDateFilter = "";
        document.getElementById("selectedDateLabel").textContent = "Date";
        closeDateModal();
        applyFilters();
      }

      function isSelectedDate(date) {
        if (!selectedDateFilter) return true;

        const selected = new Date(selectedDateFilter);
        const target = new Date(date);

        return (
          selected.getFullYear() === target.getFullYear() &&
          selected.getMonth() === target.getMonth() &&
          selected.getDate() === target.getDate()
        );
      }

      function getPeriodTitle(period) {
        const titles = {
          today: "Demandes reçues aujourd’hui",
          week: "Demandes reçues cette semaine",
          month: "Demandes reçues ce mois",
          all: "Toutes les demandes reçues",
        };

        return titles[period] || "Demandes reçues";
      }

      function renderActions(t) {
        if (t.status === "pending") {
          return `
          <button class="small-btn success-btn" onclick="updateStatus(${t.id}, 'approved')">✅ Valider</button>
          <button class="small-btn danger-btn" onclick="openRejectModal(${t.id})">❌ Refuser</button>
        `;
        }

        if (t.status === "approved") {
          return `
          <button class="small-btn primary-small-btn" onclick="openSentModal(${t.id}, ${t.amount})">📤 Marquer envoyé</button>
        `;
        }

        return `<span class="final-status">${statusLabel(t.status)}</span>`;
      }

      async function loadTransactions() {
        requestsList.innerHTML = `<p class="empty-text">Chargement...</p>`;
        paginationBox.innerHTML = "";
        miniSummary.innerHTML = "";

        try {
          const res = await fetch(`${API_URL}/transactions`, { headers });
          const data = await res.json();

          if (!data.success) {
            requestsList.innerHTML = `<p class="error">${data.message}</p>`;
            return;
          }

          allTransactions = (data.transactions || []).sort(
            (a, b) => new Date(b.created_at) - new Date(a.created_at),
          );

          applyFilters();
        } catch (error) {
          requestsList.innerHTML = `<p class="error">Serveur indisponible</p>`;
        }
      }

      function applyFilters() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const status = document.getElementById("statusFilter").value;
        const period = document.getElementById("periodFilter").value;
        const today = new Date();

        filteredTransactions = allTransactions.filter((t) => {
          const createdAt = new Date(t.created_at);

          const matchStatus = status === "all" || t.status === status;

          const matchSearch =
            !search ||
            String(t.phone).toLowerCase().includes(search) ||
            String(t.amount).toLowerCase().includes(search) ||
            String(t.created_by_name || "")
              .toLowerCase()
              .includes(search) ||
            String(t.original_message || "")
              .toLowerCase()
              .includes(search) ||
            String(t.final_message || "")
              .toLowerCase()
              .includes(search) ||
            String(t.rejection_reason || "")
              .toLowerCase()
              .includes(search);

          let matchPeriod = true;

          if (selectedDateFilter) {
            matchPeriod = isSelectedDate(createdAt);
          } else {
            if (period === "today") {
              matchPeriod = isSameDay(createdAt, today);
            } else if (period === "week") {
              matchPeriod = isSameWeek(createdAt);
            } else if (period === "month") {
              matchPeriod = isSameMonth(createdAt);
            }
          }

          return matchStatus && matchSearch && matchPeriod;
        });

        currentPage = 1;
        renderRequests();
      }

      function renderSummary() {
        const period = document.getElementById("periodFilter").value;
        const totalAmount = filteredTransactions.reduce(
          (sum, t) => sum + Number(t.amount || 0),
          0,
        );
        const pendingCount = filteredTransactions.filter(
          (t) => t.status === "pending",
        ).length;

        miniSummary.innerHTML = `
        <div class="summary-line">
          <strong>${getPeriodTitle(period)}</strong>
          <span>${filteredTransactions.length} demande(s) • ${formatMoney(totalAmount)} • ${pendingCount} en attente</span>
        </div>
      `;
      }

      function renderRequests() {
        renderSummary();

        if (!filteredTransactions || filteredTransactions.length === 0) {
          requestsList.innerHTML = `<p class="empty-text">Aucune demande trouvée pour cette période.</p>`;
          paginationBox.innerHTML = "";
          return;
        }

        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredTransactions.slice(start, end);

        requestsList.innerHTML = pageItems
          .map(
            (t) => `
        <article class="request-card compact-request-card">
          <div class="request-top">
            <div>
              <h3>${formatMoney(t.amount)}</h3>
              <p>${t.phone}</p>
            </div>
            <span class="status-pill ${t.status}">${statusLabel(t.status)}</span>
          </div>

          ${
            t.original_message
              ? `
            <p class="compact-response">💬 ${t.original_message}</p>
          `
              : ""
          }

          ${
            t.final_message
              ? `
            <p class="compact-response success">✅ ${t.final_message}</p>
          `
              : ""
          }

          ${
            t.rejection_reason
              ? `
            <p class="compact-response error">❌ ${t.rejection_reason}</p>
          `
              : ""
          }

        <div class="request-info compact-info">
  <p><strong>Créée par :</strong> ${t.created_by_name || "Terrain"}</p>
  <p><strong>Date :</strong> ${formatDate(t.created_at)}</p>

  ${
    ["sent", "rejected"].includes(t.status)
      ? `
      <p
  id="seen-status-${t.id}"
  class="seen-status ${t.terrain_seen_at ? "seen" : "pending-seen"}"
>
  ${
    t.terrain_seen_at
      ? `<span class="seen-checks">✓✓</span> Vue par Terrain à ${formatDate(t.terrain_seen_at)}`
      : `<span class="seen-checks">✓</span> Réponse envoyée à Terrain`
  }
</p>
      `
      : ""
  }
</div>

          <div class="request-actions">
            <button class="small-btn primary-small-btn" onclick="openDetails(${t.id})">Voir détails</button>
            ${renderActions(t)}
          </div>
        </article>
      `,
          )
          .join("");

        renderPagination();
      }

      function renderPagination() {
        const totalPages = Math.ceil(
          filteredTransactions.length / itemsPerPage,
        );

        if (totalPages <= 1) {
          paginationBox.innerHTML = "";
          return;
        }

        paginationBox.innerHTML = `
        <button class="small-btn" onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>← Précédent</button>
        <span>Page ${currentPage} / ${totalPages}</span>
        <button class="small-btn" onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>Suivant →</button>
      `;
      }

      function prevPage() {
        if (currentPage > 1) {
          currentPage--;
          renderRequests();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      function nextPage() {
        const totalPages = Math.ceil(
          filteredTransactions.length / itemsPerPage,
        );

        if (currentPage < totalPages) {
          currentPage++;
          renderRequests();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      async function openDetails(id) {
        const t = allTransactions.find(
          (item) => Number(item.id) === Number(id),
        );

        if (!t) return;

        // L'agent vient réellement d'ouvrir la demande
        if (!t.agent_seen_at) {
          try {
            const res = await fetch(
              `${API_URL}/transactions/seen/agent/${id}`,
              {
                method: "PUT",
                headers,
              },
            );

            const data = await res.json();

            if (data.success) {
              t.agent_seen_at = data.agent_seen_at || new Date().toISOString();
            }
          } catch (error) {
            console.log("Impossible de marquer la demande comme vue");
          }
        }

        const oldModal = document.getElementById("detailsModal");
        if (oldModal) oldModal.remove();

        const terrainAudioUrl = t.terrain_audio_url
          ? `${BASE_URL}${t.terrain_audio_url}`
          : "";
        const agentAudioUrl = t.agent_audio_url
          ? `${BASE_URL}${t.agent_audio_url}`
          : "";
        const receiptUrl = t.receipt_image_url
          ? `${BASE_URL}${t.receipt_image_url}`
          : "";

        document.body.insertAdjacentHTML(
          "beforeend",
          `
        <div class="custom-modal" id="detailsModal" onclick="closeDetails()">
          <div class="modal-box details-modal-box" onclick="event.stopPropagation()">
            <h2>Détails demande</h2>
            <p>${formatMoney(t.amount)} • ${t.phone}</p>

            ${
              t.original_message
                ? `
              <div class="original-message-box">
                <span>Message reçu</span>
                <strong>${t.original_message}</strong>
              </div>
            `
                : ""
            }

            ${
              terrainAudioUrl
                ? `
              <div class="audio-player-box">
                <div>
                  <strong>🎙️ Audio terrain</strong>
                  <small>Preuve vocale liée à cette demande</small>
                </div>
                <audio controls src="${terrainAudioUrl}"></audio>
              </div>
            `
                : ""
            }

            ${
              agentAudioUrl
                ? `
              <div class="audio-player-box agent-audio-box">
                <div>
                  <strong>🎧 Audio agent</strong>
                  <small>Réponse vocale liée à cette demande</small>
                </div>
                <audio controls src="${agentAudioUrl}"></audio>
              </div>
            `
                : ""
            }

            ${
              receiptUrl
                ? `
              <button type="button" class="receipt-thumb" onclick="openImageModal('${receiptUrl}')">
                <img src="${receiptUrl}" alt="Capture transaction" />
                <span>Voir capture en grand</span>
              </button>
            `
                : ""
            }

            <div class="request-info">
              <p><strong>Statut :</strong> ${statusLabel(t.status)}</p>
              <p><strong>Créée par :</strong> ${t.created_by_name || "Terrain"}</p>
              <p><strong>Date :</strong> ${formatDate(t.created_at)}</p>
              ${t.note ? `<p><strong>Note :</strong> ${t.note}</p>` : ""}
              ${t.final_message ? `<p class="success"><strong>Réponse :</strong> ${t.final_message}</p>` : ""}
              ${t.rejection_reason ? `<p class="error"><strong>Refus :</strong> ${t.rejection_reason}</p>` : ""}
            </div>

            <div class="modal-actions">
              <button class="small-btn danger-btn" onclick="closeDetails()">Fermer</button>
            </div>
          </div>
        </div>
      `,
        );
      }

      function closeDetails() {
        const modal = document.getElementById("detailsModal");
        if (modal) modal.remove();
      }

      async function updateStatus(id, status, extraData = {}) {
        try {
          const res = await fetch(`${API_URL}/transactions/status/${id}`, {
            method: "PUT",
            headers,
            body: JSON.stringify({
              status,
              validated_by: user.id,
              ...extraData,
            }),
          });

          const data = await res.json();

          if (!data.success) {
            showPopup(
              "error",
              "Erreur",
              `${data.message || "Erreur"} ${data.error || ""}`,
            );
            return;
          }

          if (agentAudioBlob) {
            await uploadAgentAudio(id);
          }

          closeModal();
          loadTransactions();
        } catch (error) {
          showPopup(
            "error",
            "Serveur indisponible",
            error.message || "Impossible de contacter le serveur.",
          );
        }
      }

      function openSentModal(id, amount) {
        resetAgentAudio();
        closeModal();

        const formatted = formatMoney(amount);

        document.body.insertAdjacentHTML(
          "beforeend",
          `
        <div class="custom-modal" id="customModal" onclick="closeModal()">
          <div class="modal-box" onclick="event.stopPropagation()">
            <h2>📤 Confirmer l’envoi</h2>
            <p>Le nom du client est facultatif. Le message final sera généré automatiquement.</p>

            <label>Nom du client</label>
            <input id="finalClientName" placeholder="Ex : elie (le nom est facultatif)" oninput="updateFinalPreview('${formatted}')" />

            <label>Message final automatique</label>
            <div class="final-message-preview" id="finalMessagePreview">
              ✅ ${formatted} ina enda kwa ...
            </div>
            <div id="sentErrorBox" class="compact-response error" style="display:none;"></div>

            <label>Capture transaction</label>

<div class="receipt-source-actions">
  <button
    type="button"
    class="small-btn primary-small-btn"
    onclick="openReceiptCamera()"
  >
    📷 Caméra
  </button>

  <button
    type="button"
    class="small-btn primary-small-btn"
    onclick="openReceiptGallery()"
  >
    🖼️ Galerie
  </button>
</div>

<!-- Galerie -->
<input
  type="file"
  id="receiptImage"
  accept="image/*"
  onchange="previewReceiptImage(event)"
  style="display:none;"
/>

<!-- Caméra arrière -->
<input
  type="file"
  id="receiptCamera"
  accept="image/*"
  capture="environment"
  onchange="previewReceiptImage(event)"
  style="display:none;"
/>

<div class="receipt-preview" id="receiptPreview">
  <span>📷 Aucune capture sélectionnée</span>
</div>
            ${audioRecorderHTML()}

            <div class="modal-actions">
              <button class="small-btn danger-btn" onclick="closeModal()">Annuler</button>
             <button class="small-btn success-btn" onclick="confirmSent(${id}, ${amount})">Confirmer envoyé</button>
            </div>
          </div>
        </div>
      `,
        );

        bindAudioButtons();
      }

      function showSentError(message) {
        const box = document.getElementById("sentErrorBox");

        if (!box) {
          showPopup("error", "Erreur", message);
          return;
        }

        box.style.display = "block";
        box.innerHTML = `❌ ${message}`;
        box.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function updateFinalPreview(amountText) {
        const name = document.getElementById("finalClientName").value.trim();
        document.getElementById("finalMessagePreview").textContent =
          `✅ ${amountText} ina enda kwa ${name || "..."}.`;
      }
      async function confirmSent(id, amount) {
        const final_client_name = document
          .getElementById("finalClientName")
          .value.trim();
        const receipt = selectedReceiptFile;
        const agencyId = localStorage.getItem("selected_agency_id");

        if (!receipt) {
          showSentError(
            "Ajoute la capture de la transaction avant de confirmer.",
          );
          return;
        }

        try {
          const balanceRes = await fetch(
            `${API_URL}/report?mode=global&agency_id=${agencyId}`,
            { headers },
          );
          const balanceData = await balanceRes.json();

          if (balanceData.success) {
            const cashRemaining = Number(
              balanceData.report.cash_remaining ||
                balanceData.report.balance ||
                0,
            );

            if (Number(amount) > cashRemaining) {
              showSentError(
                `Fonds insuffisants. Reste caisse disponible : ${formatMoney(cashRemaining)}.`,
              );
              return;
            }
          }

          const formData = new FormData();
          formData.append("final_client_name", final_client_name);
          formData.append("validated_by", user.id);
          formData.append("receipt", receipt);

          const res = await fetch(`${API_URL}/transactions/sent/${id}`, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${token}`,
            },
            body: formData,
          });

          const data = await res.json();

          if (!data.success) {
            showSentError(data.message || "Erreur lors de l’envoi.");
            return;
          }

          await uploadAgentAudio(id);

          closeModal();
          loadTransactions();
        } catch (error) {
          showSentError(error.message || "Serveur indisponible.");
        }
      }
      function openRejectModal(id) {
        resetAgentAudio();
        closeModal();

        document.body.insertAdjacentHTML(
          "beforeend",
          `
        <div class="custom-modal" id="customModal" onclick="closeModal()">
          <div class="modal-box" onclick="event.stopPropagation()">
            <h2>❌ Refuser la demande</h2>
            <p>Explique pourquoi la demande est refusée. Tu peux aussi ajouter un audio.</p>

            <label>Raison du refus</label>
            <textarea id="rejectionReason" placeholder="Ex : numéro incorrect">❌ Demande refusée : </textarea>

            ${audioRecorderHTML()}

            <div class="modal-actions">
              <button class="small-btn primary-small-btn" onclick="closeModal()">Annuler</button>
              <button class="small-btn danger-btn" onclick="confirmReject(${id})">Refuser</button>
            </div>
          </div>
        </div>
      `,
        );

        bindAudioButtons();
      }

      function confirmReject(id) {
        const rejection_reason = document

      function applyReceiptRotation() {
        const img = new Image();

        img.onload = () => {
          const normalizedRotation = ((receiptRotation % 360) + 360) % 360;

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          const isSideways =
            normalizedRotation === 90 || normalizedRotation === 270;

          canvas.width = isSideways ? img.height : img.width;
          canvas.height = isSideways ? img.width : img.height;

          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate((normalizedRotation * Math.PI) / 180);

          ctx.drawImage(img, -img.width / 2, -img.height / 2);

          canvas.toBlob(
            (blob) => {
              if (!blob) {
                showSentError("Impossible de tourner l’image.");
                return;
              }

              selectedReceiptFile = new File(
                [blob],
                `receipt-${Date.now()}.jpg`,
                {
                  type: "image/jpeg",
                },
              );

              receiptImageDataUrl = canvas.toDataURL("image/jpeg", 0.92);

              receiptRotation = 0;

              renderReceiptPreview();
            },
            "image/jpeg",
            0.92,
          );
        };

        img.src = receiptImageDataUrl;
      }

      function updateCropSelectionBox() {
        const box = document.getElementById("cropSelectionBox");

        if (!box || !cropSelection) return;

        box.style.left = cropSelection.x + "px";

        box.style.top = cropSelection.y + "px";

        box.style.height = cropSelection.height + "px";
      }

      function setupCropResizeEvents() {
        const box = document.getElementById("cropSelectionBox");

        if (!box) return;

        box.addEventListener("pointerdown", startCropResize);

        box.addEventListener("pointermove", moveCropResize);

        box.addEventListener("pointerup", endCropResize);

        box.addEventListener("pointercancel", endCropResize);
      }

      function startCropResize(event) {
        if (cropEditorMode !== "crop") return;

        event.preventDefault();

        const stage = document.getElementById("cropStage");

        const stageRect = stage.getBoundingClientRect();

        cropPointerStart = {
          x: event.clientX - stageRect.left,
          y: event.clientY - stageRect.top,
        };

        cropSelectionStart = {
          ...cropSelection,
        };

        activeCropHandle = event.target.dataset.handle || "move";

        event.currentTarget.setPointerCapture?.(event.pointerId);
      }

      function moveCropResize(event) {
        if (!cropPointerStart || !cropSelectionStart) {
          return;
        }

        event.preventDefault();

        const stage = document.getElementById("cropStage");

        const stageWidth = stage.clientWidth;

        const stageHeight = stage.clientHeight;

        const stageRect = stage.getBoundingClientRect();

        const currentX = event.clientX - stageRect.left;

        const currentY = event.clientY - stageRect.top;

        const dx = currentX - cropPointerStart.x;

        const dy = currentY - cropPointerStart.y;

        const start = cropSelectionStart;

        const minSize = 60;

        let x = start.x;
        let y = start.y;
        let width = start.width;
        let height = start.height;

        // Déplacer tout le cadre
        if (activeCropHandle === "move") {
          x = Math.max(0, Math.min(start.x + dx, stageWidth - start.width));

          y = Math.max(0, Math.min(start.y + dy, stageHeight - start.height));
        }

        // Bord droit
        if (activeCropHandle.includes("e")) {
          width = Math.max(
            minSize,
            Math.min(start.width + dx, stageWidth - start.x),
          );
        }

        // Bord gauche
        if (activeCropHandle.includes("w")) {
          let newX = start.x + dx;

          newX = Math.max(0, Math.min(newX, start.x + start.width - minSize));

          width = start.width + (start.x - newX);

          x = newX;
        }

        // Bas
        if (activeCropHandle.includes("s")) {
          height = Math.max(
            minSize,
            Math.min(start.height + dy, stageHeight - start.y),
          );
        }

        // Haut
        if (activeCropHandle.includes("n")) {
          let newY = start.y + dy;

          newY = Math.max(0, Math.min(newY, start.y + start.height - minSize));

          height = start.height + (start.y - newY);

          y = newY;
        }

        cropSelection = {
          x,
          y,
          width,
          height,
        };

        updateCropSelectionBox();
      }

      function endCropResize(event) {
        cropPointerStart = null;
        cropSelectionStart = null;
        activeCropHandle = null;

        event.currentTarget?.releasePointerCapture?.(event.pointerId);
      }

      function setCropEditorMode(mode) {
        cropEditorMode = mode;

        cropBtn?.classList.toggle("active", mode === "crop");

        brushBtn?.classList.toggle("active", mode === "brush");

          brush.style.pointerEvents = "auto";

      function setupBrushEvents() {
        brushCanvas.style.touchAction = "none";

        brushCanvas.addEventListener("pointerdown", startReceiptBrush);

        brushCanvas.addEventListener("pointermove", moveReceiptBrush);

        brushCanvas.addEventListener("pointerup", endReceiptBrush);

        brushCanvas.addEventListener("pointercancel", endReceiptBrush);
      }

      function getBrushPoint(event) {
        const rect = brushCanvas.getBoundingClientRect();

        return {
          x: (event.clientX - rect.left) * (brushCanvas.width / rect.width),

          y: (event.clientY - rect.top) * (brushCanvas.height / rect.height),
        };
      }

      function startReceiptBrush(event) {
        if (cropEditorMode !== "brush") return;

        event.preventDefault();

        isBrushing = true;

        lastBrushPoint = getBrushPoint(event);

        brushCanvas.setPointerCapture?.(event.pointerId);
      }

      function moveReceiptBrush(event) {
        if (!isBrushing || cropEditorMode !== "brush") {
          return;
        }

        event.preventDefault();

        const point = getBrushPoint(event);

        const rect = brushCanvas.getBoundingClientRect();

        const displayBrushSize = Number(
          document.getElementById("brushSize")?.value || 28,
        );

        const scale = brushCanvas.width / rect.width;

        brushCtx.strokeStyle = "#111111";

        brushCtx.lineWidth = displayBrushSize * scale;

        brushCtx.lineCap = "round";

        brushCtx.lineJoin = "round";

        brushCtx.beginPath();

        brushCtx.moveTo(lastBrushPoint.x, lastBrushPoint.y);

        brushCtx.lineTo(point.x, point.y);

        brushCtx.stroke();

        lastBrushPoint = point;
      }

      function endReceiptBrush(event) {
        if (!isBrushing) return;

        isBrushing = false;
        lastBrushPoint = null;

        brushCanvas.releasePointerCapture?.(event.pointerId);
      }

      function clearReceiptMask() {
        if (!brushCtx || !brushCanvas) return;

        brushCtx.clearRect(0, 0, brushCanvas.width, brushCanvas.height);
      }

      function resetCropEditor() {
        const stage = document.getElementById("cropStage");

        cropSelection = {

      function applyReceiptCrop() {
        if (!cropSelection) return;

        const stage = document.getElementById("cropStage");

        const stageWidth = stage.clientWidth;

        const stageHeight = stage.clientHeight;

        const scaleX = cropCanvas.width / stageWidth;

        const scaleY = cropCanvas.height / stageHeight;

        const sourceX = Math.round(cropSelection.x * scaleX);

        const sourceY = Math.round(cropSelection.y * scaleY);

        const sourceWidth = Math.round(cropSelection.width * scaleX);

        const sourceHeight = Math.round(cropSelection.height * scaleY);

        const mergedCanvas = document.createElement("canvas");

        const mergedCtx = mergedCanvas.getContext("2d");

        mergedCanvas.width = cropCanvas.width;

        mergedCanvas.height = cropCanvas.height;

        // Image
        mergedCtx.drawImage(cropCanvas, 0, 0);

        // Masquage pinceau
        mergedCtx.drawImage(brushCanvas, 0, 0);

        const outputCanvas = document.createElement("canvas");

        const outputCtx = outputCanvas.getContext("2d");

        outputCanvas.width = sourceWidth;

        outputCanvas.height = sourceHeight;

        outputCtx.drawImage(
          mergedCanvas,

          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,

          0,
          0,
          sourceWidth,
          sourceHeight,
        );

        outputCanvas.toBlob(
          (blob) => {
            if (!blob) {
              showSentError("Impossible de modifier la capture.");
              return;
            }

            selectedReceiptFile = new File(
              [blob],
              `receipt-${Date.now()}.jpg`,
              {
                type: "image/jpeg",
              },
            );

            receiptImageDataUrl = outputCanvas.toDataURL("image/jpeg", 0.92);

            receiptRotation = 0;

            // La modification est maintenant officiellement validée.
            receiptEditorDataUrl = "";

            destroyReceiptCropper();

            renderReceiptPreview();
          },

          "image/jpeg",
          0.92,
        );
      }

      function destroyReceiptCropper() {
        const modal = document.getElementById("receiptCropModal");

        if (modal) {
          modal.remove();
        }

        cropCanvas = null;
        cropCtx = null;
        cropImage = null;

        brushCanvas = null;
        brushCtx = null;

        cropSelection = null;

        cropPointerStart = null;
        cropSelectionStart = null;
        activeCropHandle = null;

        isBrushing = false;
        lastBrushPoint = null;
      }

      function closeReceiptCropper() {
        const modal = document.getElementById("receiptCropModal");

        if (modal) {
          modal.remove();
        }

        // On abandonne complètement le brouillon.
        receiptEditorDataUrl = "";

        cropCanvas = null;
        cropCtx = null;
        cropImage = null;

        brushCanvas = null;
        brushCtx = null;

        cropSelection = null;

        cropPointerStart = null;
        cropSelectionStart = null;
        activeCropHandle = null;

        isBrushing = false;
        lastBrushPoint = null;
        destroyReceiptCropper();
      }
      function rotateInsideCropper(degrees) {
        const merged = document.createElement("canvas");

        const mergedCtx = merged.getContext("2d");

        merged.width = cropCanvas.width;

        merged.height = cropCanvas.height;

        mergedCtx.drawImage(cropCanvas, 0, 0);

        mergedCtx.drawImage(brushCanvas, 0, 0);

        const rotation = ((degrees % 360) + 360) % 360;

        const output = document.createElement("canvas");

        const ctx = output.getContext("2d");

        output.width = merged.height;

        output.height = merged.width;

        ctx.translate(output.width / 2, output.height / 2);

        ctx.rotate((degrees * Math.PI) / 180);

        ctx.drawImage(merged, -merged.width / 2, -merged.height / 2);

        // On tourne uniquement le brouillon.
        // L'image officielle reste intacte.
        receiptEditorDataUrl = output.toDataURL("image/jpeg", 0.92);

        // On reconstruit l'éditeur sans annuler le brouillon.
        destroyReceiptCropper();

        openReceiptCropper();
      }

      async function startAgentRecording() {
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          mediaRecorder = new MediaRecorder(audioStream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            agentAudioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioUrl = URL.createObjectURL(agentAudioBlob);

            const preview = document.getElementById("agentAudioPreview");
            preview.src = audioUrl;
            preview.style.display = "block";

            const status = document.getElementById("agentAudioStatus");
            status.textContent = "Audio prêt";
            status.className = "audio-ready";

            document.getElementById("agentVoiceWave").classList.remove("show");
            document.getElementById("agentStartRecordBtn").disabled = false;
            document.getElementById("agentStopRecordBtn").disabled = true;
            document.getElementById("agentDeleteAudioBtn").disabled = false;

            if (audioStream) {
              audioStream.getTracks().forEach((track) => track.stop());
            }
          };

          mediaRecorder.start();

          const status = document.getElementById("agentAudioStatus");
          status.textContent = "Enregistrement...";
          status.className = "audio-recording";

          document.getElementById("agentVoiceWave").classList.add("show");
          document.getElementById("agentStartRecordBtn").disabled = true;
          document.getElementById("agentStopRecordBtn").disabled = false;
          document.getElementById("agentDeleteAudioBtn").disabled = true;
        } catch (error) {
          showPopup(
            "error",
            "Micro indisponible",
            "Micro non autorisé ou indisponible.",
          );
        }
      }

      function stopAgentRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();

            if (!el) return;

            if (t.terrain_seen_at) {
              el.className = "seen-status seen";

              el.innerHTML =
                `<span class="seen-checks">✓✓</span> ` +
                `Vue par Terrain à ${formatDate(t.terrain_seen_at)}`;
            }
          });
        } catch (error) {
          console.log("Actualisation vu indisponible", error);
        }
      }, 3000);
    </script>
  </body>
</html>
